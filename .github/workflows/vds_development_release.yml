name: VDS Development Release (Continuous Delivery)

on:
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: vds-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Standalone EXE & Publish VDS Release
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 8 SDK with Cache
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: 'SimilarProductsWinForms.sln'

      - name: Restore Dependencies
        run: dotnet restore SimilarProductsWinForms.sln

      - name: Build Standalone Win-x64 Executable
        run: |
          dotnet publish SimilarProductsWinForms.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true -o publish_vds_standalone

      - name: Build Standalone Win-x64 API
        shell: pwsh
        run: |
          dotnet publish .\src\EtsyMarketPlace.Api\EtsyMarketPlace.Api.csproj -c Release -r win-x64 --self-contained true -o publish_api_vds
          Compress-Archive -Path publish_api_vds\* -DestinationPath publish_vds_standalone\EtsyMarketPlace.Api.zip -Force

      - name: Verify Published Artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "publish_vds_standalone\SimilarProductsWinForms.exe")) {
            Write-Error "SimilarProductsWinForms.exe dosyasi bulunamadi!"
            exit 1
          }
          if (-not (Test-Path "publish_vds_standalone\EtsyMarketPlace.Api.zip")) {
            Write-Error "EtsyMarketPlace.Api.zip dosyasi bulunamadi!"
            exit 1
          }
          $itemExe = Get-Item "publish_vds_standalone\SimilarProductsWinForms.exe"
          $itemApi = Get-Item "publish_vds_standalone\EtsyMarketPlace.Api.zip"
          Write-Host "Uretilen EXE Boyutu: $($itemExe.Length) bayt ($([math]::Round($itemExe.Length / 1MB, 2)) MB)"
          Write-Host "Uretilen API Zip Boyutu: $($itemApi.Length) bayt ($([math]::Round($itemApi.Length / 1MB, 2)) MB)"

      - name: Publish or Update 'dev-latest' GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROMPT_DISABLED: "1"
        run: |
          $notes = @"
          ## 🚀 Otomatik VDS Geliştirme Sürümü (development)
          
          Bu sürüm development dalına yapılan son push ile GitHub Actions tarafından otomatik derlenmiştir.
          
          - **Commit:** ${{ github.sha }}
          - **Tarih:** ${{ github.event.head_commit.timestamp }}
          - **Platform:** Windows x64 (Standalone - .NET Runtime GEREKTİRMEZ)
          - **Hedef:** VDS Sunucusu Otomatik Güncelleme
          
          *VDS üzerindeki Guncelle_Ve_Baslat.bat masaüstü uygulamasını, API_Guncelle_Ve_Baslat.bat ise VDS API'sini otomatik indirip günceller.*
          "@
          $notes | Out-File -FilePath release_notes.md -Encoding utf8
          
          Write-Host "Force-updating Git tag 'dev-latest' to commit ${{ github.sha }}..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f dev-latest ${{ github.sha }}
          git push -f origin dev-latest
          
          Write-Host "Re-creating 'dev-latest' release pointing to commit ${{ github.sha }}..."
          try {
            gh release delete dev-latest -y 2>$null
          } catch { }

          gh release create dev-latest publish_vds_standalone/SimilarProductsWinForms.exe publish_vds_standalone/EtsyMarketPlace.Api.zip deploy/Client_Guncelle.bat deploy/vds_update.ps1 deploy/Guncelle_Ve_Baslat.bat deploy/API_Guncelle_Ve_Baslat.bat deploy/api_vds_update.ps1 --title "VDS Development Build (Son Geliştirme Sürümü)" --notes-file release_notes.md --prerelease --target ${{ github.sha }}
          Write-Host "VDS release successfully published!"

name: VDS Development Release (Continuous Delivery)

on:
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: vds-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Standalone EXE & Publish VDS Release
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 8 SDK with Cache
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: 'SimilarProductsWinForms.sln'

      - name: Restore Dependencies
        run: dotnet restore SimilarProductsWinForms.sln

      - name: Build Standalone Win-x64 Executable
        run: |
          dotnet publish SimilarProductsWinForms.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true -o publish_vds_standalone

      - name: Verify Published Artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "publish_vds_standalone\SimilarProductsWinForms.exe")) {
            Write-Error "SimilarProductsWinForms.exe dosyasi bulunamadi!"
            exit 1
          }
          $item = Get-Item "publish_vds_standalone\SimilarProductsWinForms.exe"
          Write-Host "Uretilen EXE Boyutu: $($item.Length) bayt ($([math]::Round($item.Length / 1MB, 2)) MB)"

      - name: Publish or Update 'dev-latest' GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROMPT_DISABLED: "1"
        run: |
          $notes = @"
          ## 🚀 Otomatik VDS Geliştirme Sürümü (development)
          
          Bu sürüm development dalına yapılan son push ile GitHub Actions tarafından otomatik derlenmiştir.
          
          - **Commit:** ${{ github.sha }}
          - **Tarih:** ${{ github.event.head_commit.timestamp }}
          - **Platform:** Windows x64 (Standalone - .NET Runtime GEREKTİRMEZ)
          - **Hedef:** VDS Sunucusu Otomatik Güncelleme
          
          *VDS üzerindeki Guncelle_Ve_Baslat.bat bu dosyayı otomatik indirip çalıştırır.*
          "@
          $notes | Out-File -FilePath release_notes.md -Encoding utf8
          
          Write-Host "Checking if 'dev-latest' release exists..."
          $releaseExists = $false
          try {
            gh release view dev-latest --json tagName 2>$null
            if ($LASTEXITCODE -eq 0) { $releaseExists = $true }
          } catch {
            $releaseExists = $false
          }
          
          if (-not $releaseExists) {
            Write-Host "Creating 'dev-latest' pre-release pointing to commit ${{ github.sha }}..."
            gh release create dev-latest publish_vds_standalone/SimilarProductsWinForms.exe deploy/Client_Guncelle.bat deploy/vds_update.ps1 deploy/Guncelle_Ve_Baslat.bat --title "VDS Development Build (Son Geliştirme Sürümü)" --notes-file release_notes.md --prerelease --target ${{ github.sha }}
          } else {
            Write-Host "Updating 'dev-latest' release pointing to commit ${{ github.sha }}..."
            gh release edit dev-latest --title "VDS Development Build (Son Geliştirme Sürümü)" --notes-file release_notes.md --target ${{ github.sha }}
            Write-Host "Uploading standalone assets with --clobber..."
            gh release upload dev-latest publish_vds_standalone/SimilarProductsWinForms.exe deploy/Client_Guncelle.bat deploy/vds_update.ps1 deploy/Guncelle_Ve_Baslat.bat --clobber
          }
          Write-Host "VDS release successfully published!"
